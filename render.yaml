# Render Blueprint (deploys DB + backend + frontend)
# Use this file if your Git repo root is React-Landing-Page-Template/.

services:
  - type: web
    name: e-psycholog-api
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: INIT_DB_ON_BOOT
        value: "true"
      - key: FRONTEND_URL
        value: "https://e-psycholog-web.onrender.com"
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        value: ""
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
      - key: GOOGLE_CALLBACK_URL
        value: "https://e-psycholog-api.onrender.com/api/auth/google/callback"
      - key: DATABASE_URL
        fromDatabase:
          name: e-psycholog-db
          property: connectionString

  - type: static
    name: e-psycholog-web
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    autoDeploy: true
    envVars:
      - key: REACT_APP_API_BASE
        value: "https://e-psycholog-api.onrender.com"

databases:
  - name: e-psycholog-db
    plan: free
