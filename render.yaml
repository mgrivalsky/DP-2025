# Render Blueprint (deploys DB + backend + frontend)
# Use this file if your Git repo root is React-Landing-Page-Template/.

services:
  - type: web
    name: e-psycholog-api-2wzb
    env: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: INIT_DB_ON_BOOT
        value: "true"
      - key: FRONTEND_URL
        value: "https://e-psycholog-web-2wzb.onrender.com"
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CALLBACK_URL
        value: "https://e-psycholog-api-2wzb.onrender.com/api/auth/google/callback"

      # ------------------------ DOPLNIŤ ------------------------
      # - key: DATABASE_URL
      #   value: "postgresql://USER:PASSWORD@HOST/DB?sslmode=require"  
      # - key: DATA_ENCRYPTION_KEY
      #   value: "<base64 32-byte key>"  # nemenit po nasadeni
      # - key: GOOGLE_CLIENT_ID
      #   value: "<from Google Cloud Console>"
      # - key: GOOGLE_CLIENT_SECRET
      #   value: "<from Google Cloud Console>"
      # - key: ADMIN_EMAILS
      #   value: "email1@gmail.com,email2@gmail.com"  

  - type: web
    name: e-psycholog-web-2wzb
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    autoDeploy: true
    envVars:
      - key: REACT_APP_API_BASE
        value: "https://e-psycholog-api-2wzb.onrender.com"

